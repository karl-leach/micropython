name: Build ESP32-C3 MicroPython Firmware

on:
  push:
    branches: [c3-wake-and-pins]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-pip python3-venv \
            git wget flex bison gperf \
            ninja-build ccache \
            libffi-dev libssl-dev dfu-util

      - name: Setup CMake 3.19.7
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '3.19.7'

      - name: Install ESP-IDF v5.2
        run: |
          git clone https://github.com/espressif/esp-idf.git $GITHUB_WORKSPACE/esp-idf
          cd $GITHUB_WORKSPACE/esp-idf
          git checkout release/v5.2
          git submodule update --init --recursive
          ./install.sh esp32c3

      - name: Patch lwIP DHCP backoff helper
        run: |
          sed -i 's/DHCP_REQUEST_BACKOFF_SEQUENCE/DHCP_REQUEST_TIMEOUT_SEQUENCE/g' \
            $GITHUB_WORKSPACE/esp-idf/components/lwip/lwip/src/core/ipv4/dhcp.c

      - name: Export ESP-IDF environment
        run: |
          source $GITHUB_WORKSPACE/esp-idf/export.sh
          echo "ESP-IDF v5.2 environment sourced"

      - name: Build firmware for ESP32-C3
        run: |
          source $GITHUB_WORKSPACE/esp-idf/export.sh
          cd $GITHUB_WORKSPACE/ports/esp32
          make BOARD=ESP32_GENERIC_C3

      - name: Upload firmware.bin
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32-c3
          path: ports/esp32/build-GENERIC_C3/firmware.bin
